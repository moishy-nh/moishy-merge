name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build App
        run: nativefier "https://moishy-merge.vercel.app" --name "MoishyMerge" --out dist --portable

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoishyMerge-EXE
          path: dist/**/*
          if-no-files-found: error
